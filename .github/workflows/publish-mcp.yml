name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry as
# io.github.Gadriel-ai/gadriel. Uses GitHub OIDC — because this workflow runs
# in a Gadriel-ai repo, its OIDC token is authorized for the io.github.Gadriel-ai/*
# namespace (interactive `mcp-publisher login github` only grants a personal
# namespace, which is why publishing must go through CI here).
#
# The gadriel npm package is already published separately (preflight
# release-gadriel-npm.yml); this only registers the server metadata.

on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
